[pytest]
# Automatically handle async tests without needing @pytest.mark.asyncio everywhere
asyncio_mode = auto

# Where to look for tests
testpaths = tests

# Naming conventions for test files and functions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# default command line options
# -v: verbose
# --disable-warnings: keeps the output clean
addopts = -v --disable-warnings

# Markers to categorize tests (optional but good practice)
markers =
    unit: Isolated unit tests
    integration: Tests checking API endpoints
    slow: Tests that take a long time