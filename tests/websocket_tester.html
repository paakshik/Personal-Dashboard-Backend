<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI WebSocket Tester</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background-color: #f4f4f9; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; }

    .control-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #555; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }

    button { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    button.disconnect { background-color: #dc2626; }
    button.disconnect:hover { background-color: #b91c1c; }

    #status { display: inline-block; margin-left: 10px; font-weight: bold; }
    .status-connected { color: #16a34a; }
    .status-disconnected { color: #dc2626; }

    #chat-window { border: 1px solid #e5e7eb; border-radius: 8px; height: 400px; overflow-y: auto; padding: 1rem; background: #fafafa; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
    .msg.user { align-self: flex-end; background-color: #2563eb; color: white; }
    .msg.ai { align-self: flex-start; background-color: #e5e7eb; color: #1f2937; }
    .msg.system { align-self: center; background-color: transparent; color: #6b7280; font-size: 0.85rem; font-style: italic; }

    .input-area { display: flex; gap: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ Nexus AI Stream Test</h2>

  <div class="control-group">
    <label for="token">JWT Token (Bearer):</label>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="token" placeholder="Paste your access token here without 'Bearer ' prefix">
      <button onclick="toggleConnection()" id="connectBtn">Connect</button>
    </div>
    <div style="margin-top: 10px;">
      Status: <span id="status" class="status-disconnected">Disconnected</span>
    </div>
  </div>

  <hr style="border: 0; border-top: 1px solid #eee; margin: 1.5rem 0;">

  <div id="chat-window"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message to Gemini..." disabled onkeydown="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
  </div>
</div>

<script>
  let ws = null;
  const connectBtn = document.getElementById('connectBtn');
  const sendBtn = document.getElementById('sendBtn');
  const messageInput = document.getElementById('messageInput');
  const statusSpan = document.getElementById('status');
  const chatWindow = document.getElementById('chat-window');

  function toggleConnection() {
    if (ws) {
      ws.close();
    } else {
      const token = document.getElementById('token').value.trim();
      if (!token) {
        alert("Please enter a JWT Token first!");
        return;
      }

      // 1. Initialize WebSocket Connection
      // NOTE: Ensure port 8000 matches your backend port
      const wsUrl = `ws://localhost:8000/dashboard/gemini/stream?token=${token}`;
      ws = new WebSocket(wsUrl);

      // 2. Event Handlers
      ws.onopen = () => {
        statusSpan.textContent = "Connected 🟢";
        statusSpan.className = "status-connected";
        connectBtn.textContent = "Disconnect";
        connectBtn.classList.add("disconnect");
        enableInput(true);
        addMessage("System", "Connected to Gemini AI Stream.");
      };

      ws.onmessage = (event) => {
        // The backend streams text chunks, we append them to the last AI message
        // or create a new one if the previous one wasn't AI.
        handleIncomingStream(event.data);
      };

      ws.onclose = (event) => {
        resetUI();
        addMessage("System", `Disconnected (Code: ${event.code})`);
        if (event.code === 1008) {
          addMessage("System", "❌ Auth Failed: Check your token.");
        }
      };

      ws.onerror = (error) => {
        console.error("WebSocket Error:", error);
        statusSpan.textContent = "Error 🔴";
      };
    }
  }

  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !ws) return;

    addMessage("User", text);
    const payload = {
      prompt: text,
      attachment_id: null  // Start with null for now
    };
    ws.send(JSON.stringify(payload));
    messageInput.value = "";

    // Prepare a container for the incoming AI response
    currentAiMessageDiv = null;
  }

  // --- Helper Logic for Streaming Response ---
  let currentAiMessageDiv = null;

  function handleIncomingStream(text) {
    if (!currentAiMessageDiv) {
      currentAiMessageDiv = document.createElement('div');
      currentAiMessageDiv.className = 'msg ai';
      chatWindow.appendChild(currentAiMessageDiv);
    }
    currentAiMessageDiv.textContent += text;
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role.toLowerCase()}`;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // Reset the streaming container when user sends a new message
    if(role === 'User') currentAiMessageDiv = null;
  }

  function resetUI() {
    ws = null;
    statusSpan.textContent = "Disconnected 🔴";
    statusSpan.className = "status-disconnected";
    connectBtn.textContent = "Connect";
    connectBtn.classList.remove("disconnect");
    enableInput(false);
  }

  function enableInput(enabled) {
    messageInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if(enabled) messageInput.focus();
  }
</script>

</body>
</html>
